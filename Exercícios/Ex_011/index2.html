<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon2.ico" type="image/x-icon">
    <title>Imagem Cropada</title>
</head>
<body>
    <h1>Imagem Cropada</h1>
    <p>mude o tamanho do navegador para ver a imagem mudando</p>
    <picture>
        <source media="(max-width: 720px)" srcset="Imagens/img-p.png" type="image/png">
        <source media="(max-width: 1030px)" srcset="Imagens/img-m.png" type="image/png">
    <img src="Imagens/img-g.jpg" alt="Foto Grande">        </img>
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Colocando som na página</p>
    <h2>Forma 1</h2>
    <audio src="midia/By Myself - The Grey Room _ Clark Sims.mp3" autoplay controls ></audio>
    <h2>Forma 2</h2>
    <audio preload="none" loop controls>
        <source src="midia/First Call - Kevin MacLeod.mp3" type="audio/mpeg">
        <p>Seu navegador não suporta o elemento de áudio.</p>
    </audio>
</body>
</html>
