<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #container{
            width: 600px;
            height: 600px;
            background-color: blue;
            padding: 10px;
            background-image: url(assets/target001.png);
            background-size: 100% 100%;
            position: relative;
        }
        #conteudo{
            position: absolute;
            height: 250px;
            width: 250px;
            background-color: rgb(255, 127, 80);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-image: url(assets/target001.png);
            background-size: 100% 100%;
            
        
        }
    </style>
    <title>Alinhamento Vertical</title>
</head>
<body>
    <section id="container">
        <aside id="conteudo"></aside>
    </section>
</body>
</html>
